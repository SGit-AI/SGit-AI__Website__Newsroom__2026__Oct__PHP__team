# Deploy this repository to GitHub Pages from dev: run its gate, then publish the repository as served, with the
# indexes the team's pages read when they load (tools/index.py: records/index/*.json, written here, never committed).
# A record an agent releases is on its page at this deploy, with no build anywhere else. Pages source must be "GitHub
# Actions". A change to this workflow goes to security@php.newsroom's review and the editor's go (CLAUDE.md).
name: Deploy to GitHub Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
# The gate and the package run repository code, so they run with read-only permissions; only the deploy job, which
# runs no repository code, can write to Pages or mint an OIDC token. Actions are pinned to commit SHAs (the tag is in
# the comment).
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0          # the history: a brief is published when the commit that added it was made
      - name: Run the gate
        run: python3 tools/gate.py && python3 tools/pages_gate.py
      - name: The served tree, with the records' indexes
        run: |
          set -euo pipefail
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          python3 tools/index.py --into _site --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
